name: Zip and Upload Resourcepacks

env:
    RESOURCEPACKS: "resourcepacks/*"

on:
    push:
        branches:
        - hexathlon5
        paths:
        - 'resourcepacks/**'
    workflow_dispatch: {}

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3
        - name: Zip Resourcepacks
          run: |
            mkdir -p zip-output
            for rp in $RESOURCEPACKS; do
                if [ -d "$rp" ]; then
                    # A directory, zip it
                    (cd "$rp" && zip -r "../zip-output/github_$rp.zip" .)
                elif [ -f "$rp" ]; then
                    # A file (probably a zip file)
                    cp "$rp" "zip-output/github_$rp"
                else
                    echo "Warning: $rp not found, skipping."
                fi
            done
        - name: Deploy to event server
          uses: wlixcc/SFTP-Deploy-Action@v1.2.4
          with:
            server: mc.datasektionen.se
            port: 2022
            username: github-actions.032bfc9c
            password: ${{ secrets.AUTODEPLOY_PASSWORD }}
            local_path: zip-output/*
            remote_path: config/metacraft-resource-packs/resource-packs/update/.
            sftp_only: true

